# End-to-end tests of the mobile app on an Android emulator (Maestro).
#
# Started by hand from the Actions tab ("Run workflow"); it builds a release APK and boots
# an emulator, so it takes 30-40 minutes and isn't run on every pull request.
# The app talks to backend/scripts/dev_server.py (mocked BVN, SMS and payments) on the
# runner, which the emulator reaches at 10.0.2.2. See mobile/.maestro/README.md.
name: E2E (Android)

on:
  workflow_dispatch:

jobs:
  maestro:
    name: Maestro flows on Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Start the API (test data, mocked providers)
        working-directory: backend
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          nohup python scripts/dev_server.py --reset --wallet > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8000/health && break; sleep 1; done

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build a release APK for testing
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_URL: http://10.0.2.2:8000
          # Test build only: real builds refuse plain HTTP.
          EXPO_PUBLIC_ALLOW_INSECURE_API: "1"
          NODE_ENV: production
        run: |
          npm ci
          npx expo prebuild --platform android --no-install
          # Let this test build reach the dev server over plain HTTP.
          sed -i 's/<application /<application android:usesCleartextTraffic="true" /' android/app/src/main/AndroidManifest.xml
          cd android && ./gradlew assembleRelease --no-daemon

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install mobile/android/app/build/outputs/apk/release/app-release.apk
            maestro test mobile/.maestro --format junit --output "$RUNNER_TEMP/maestro-report.xml"

      - name: Keep reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-android
          path: |
            ${{ runner.temp }}/maestro-report.xml
            ${{ runner.temp }}/api.log
            ~/.maestro/tests
          if-no-files-found: ignore

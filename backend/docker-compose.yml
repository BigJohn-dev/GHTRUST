services:
  postgres:
    image: postgres:16-alpine
    container_name: ghtrust-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ghtrust}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ghtrust_secret}
      POSTGRES_DB: ${POSTGRES_DB:-ghtrust_mfb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ghtrust} -d ${POSTGRES_DB:-ghtrust_mfb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ghtrust-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghtrust-backend:latest
    container_name: ghtrust-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery-worker:
    image: ghtrust-backend:latest
    profiles: ["full"]
    container_name: ghtrust-celery-worker
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info -Q scheduled,notifications,transactions,reconciliation,celery

  celery-beat:
    image: ghtrust-backend:latest
    profiles: ["full"]
    container_name: ghtrust-celery-beat
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./app:/app/app
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.core.celery_app.celery_app beat --loglevel=info

volumes:
  postgres_data:
  redis_data:

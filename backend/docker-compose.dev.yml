# Local dev: only Postgres + Redis. Run the API on your Mac with .venv (fast).
services:
  postgres:
    image: postgres:16-alpine
    container_name: ghtrust-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ghtrust}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ghtrust_secret}
      POSTGRES_DB: ${POSTGRES_DB:-ghtrust_mfb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ghtrust} -d ${POSTGRES_DB:-ghtrust_mfb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ghtrust-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
